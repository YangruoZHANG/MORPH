[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-trajectory-eval"
version = "1.0.0"
description = "Auditable trajectory-inference evaluation on frozen MORPH simulations"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.scripts]
morph-eval = "morph_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

